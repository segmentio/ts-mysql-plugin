name: CI

on: [push]

env:
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest-large

    strategy:
      matrix:
        node-version: [12]

    steps:
      - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e  # v1

      - name: Install Node.js
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e  # v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache Node.js dependencies
        uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7  # v1
        with:
          path: node_modules
          key: node${{ matrix.node-version }}-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install Node.js dependencies
        run: yarn --frozen-lockfile

      - name: Build TypeScript
        run: yarn build

      - name: Lint files
        run: yarn lint

      - name: Run tests
        run: |
          cd e2e
          yarn install
          docker-compose up -d
          yarn wait-port '127.0.0.1:3010' --timeout 30000 --wait-for-dns
          sleep 10 # give the database 10 seconds to seed
          cd ..
          yarn test
